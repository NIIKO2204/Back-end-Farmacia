<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Medicamento</title>
</head>
<body>
    <h1>Eliminar Medicamento</h1>

    <p>¿Estás seguro de que deseas eliminar el medicamento <strong>"{{ medicamento.nombre }}"</strong> de la base de datos?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sí, Eliminar</button>
        <a href="{% url 'inicio' %}">Cancelar</a>
    </form>
</body>
</html>
