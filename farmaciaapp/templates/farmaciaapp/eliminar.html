<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar medicamento - Farmacia Salud</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #0f172a;
            background: linear-gradient(135deg, #d1fae5, #ecfdf5, #a7f3d0);
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 6%;
            background: #ffffff;
            border-bottom: 3px solid #10b981;
            box-shadow: 0 4px 16px rgba(5, 150, 105, 0.10);
        }

        .cruz {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #10b981, #047857);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        .navbar h2 {
            color: #065f46;
            font-size: 20px;
        }

        .contenedor {
            width: 90%;
            max-width: 750px;
            margin: 45px auto;
        }

        .panel {
            padding: 35px;
            background: #ffffff;
            border: 1px solid #d1fae5;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(5, 150, 105, 0.12);
            text-align: center;
        }

        h1 {
            color: #dc2626;
            margin-bottom: 12px;
        }

        .descripcion-panel {
            color: #475569;
            line-height: 1.5;
        }

        .advertencia {
            margin-top: 20px;
            padding: 15px;
            color: #991b1b;
            background: #fee2e2;
            border-radius: 9px;
        }

        .datos {
            margin: 25px 0;
            padding: 22px;
            background: #f0fdf4;
            border: 1px solid #d1fae5;
            border-radius: 10px;
            text-align: left;
        }

        .campo {
            margin-bottom: 17px;
        }

        .campo:last-child {
            margin-bottom: 0;
        }

        .etiqueta {
            display: block;
            font-weight: 700;
            color: #065f46;
            margin-bottom: 6px;
        }

        .valor {
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .estado {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .disponible {
            color: #065f46;
            background: #d1fae5;
        }

        .no-disponible {
            color: #92400e;
            background: #fef3c7;
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button,
        .boton {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .eliminar {
            color: #ffffff;
            background: #dc2626;
        }

        .eliminar:hover {
            background: #b91c1c;
        }

        .volver {
            color: #065f46;
            background: #d1fae5;
        }

        .volver:hover {
            background: #a7f3d0;
        }

        .mensaje {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            color: #065f46;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
        }

        .mensaje-error {
            color: #991b1b;
            background: #fee2e2;
            border-color: #fecaca;
        }

        @media (max-width: 600px) {
            .contenedor {
                margin: 25px auto;
            }

            .panel {
                padding: 23px;
            }
        }
    </style>
</head>

<body>

    {% csrf_token %}

    <header class="navbar">
        <span class="cruz" aria-hidden="true">+</span>
        <h2>Farmacia Salud</h2>
    </header>

    <main class="contenedor">

        <section class="panel">

            <h1>Eliminar medicamento</h1>

            <p class="descripcion-panel">
                Revisa los datos del medicamento antes de eliminarlo del inventario.
            </p>

            <div class="advertencia">
                Atención: esta acción eliminará el registro de forma permanente.
            </div>

            <div class="datos">

                <div class="campo">
                    <span class="etiqueta">ID:</span>
                    <span id="medicamentoId" class="valor">Cargando...</span>
                </div>

                <div class="campo">
                    <span class="etiqueta">Medicamento:</span>
                    <span id="nombre" class="valor"></span>
                </div>

                <div class="campo">
                    <span class="etiqueta">Descripción / Presentación:</span>
                    <span id="descripcion" class="valor"></span>
                </div>

                <div class="campo">
                    <span class="etiqueta">Precio:</span>
                    <span id="precio" class="valor"></span>
                </div>

                <div class="campo">
                    <span class="etiqueta">Stock:</span>
                    <span id="stock" class="valor"></span>
                </div>

                <div class="campo">
                    <span class="etiqueta">Disponibilidad:</span>
                    <span id="disponibilidad" class="estado"></span>
                </div>

            </div>

            <div class="botones">

                <button
                    type="button"
                    id="btnEliminar"
                    class="eliminar"
                    disabled
                >
                    Sí, eliminar medicamento
                </button>

                <a href="/medicamentos/" class="boton volver">
                    Cancelar y volver
                </a>

            </div>

            <p id="mensaje" class="mensaje" hidden></p>

        </section>

    </main>

    <script>

        const partesURL = window.location.pathname
            .split("/")
            .filter(Boolean);

        const medicamentoId = partesURL[partesURL.length - 1];

        const btnEliminar = document.getElementById("btnEliminar");
        const mensaje = document.getElementById("mensaje");

        const csrfToken = document.querySelector(
            "[name=csrfmiddlewaretoken]"
        ).value;

        function mostrarMensaje(texto, error = false) {

            mensaje.hidden = false;
            mensaje.textContent = texto;

            mensaje.className = error
                ? "mensaje mensaje-error"
                : "mensaje";

        }

        async function cargarMedicamento() {

            try {

                const respuesta = await fetch(
                    `/api/medicamentos/${medicamentoId}/`,
                    {
                        method: "GET",
                        credentials: "same-origin",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                if (respuesta.status === 401) {

                    window.location.replace("/?expired=1");
                    return;

                }

                if (respuesta.status === 403) {

                    throw new Error(
                        "Acceso rechazado. Verifica tu sesión."
                    );

                }

                if (respuesta.status === 404) {

                    throw new Error(
                        "El medicamento solicitado no existe."
                    );

                }

                if (!respuesta.ok) {

                    throw new Error(
                        `No se pudo cargar el medicamento. HTTP ${respuesta.status}`
                    );

                }

                const medicamento = await respuesta.json();

                document.getElementById("medicamentoId").textContent = medicamento.id;
                document.getElementById("nombre").textContent = medicamento.nombre;
                document.getElementById("descripcion").textContent = medicamento.descripcion;
                document.getElementById("precio").textContent = `$${medicamento.precio}`;
                document.getElementById("stock").textContent = `${medicamento.stock} unidades`;

                const disponibilidad = document.getElementById("disponibilidad");

                if (medicamento.disponible) {

                    disponibilidad.textContent = "Disponible";
                    disponibilidad.className = "estado disponible";

                } else {

                    disponibilidad.textContent = "No disponible";
                    disponibilidad.className = "estado no-disponible";

                }

                btnEliminar.disabled = false;

            } catch (error) {

                console.error("Error al consultar medicamento:", error);

                mostrarMensaje(error.message, true);

            }

        }

        btnEliminar.addEventListener("click", async function() {

            const confirmar = confirm(
                "¿Estás seguro de que deseas eliminar este medicamento?"
            );

            if (!confirmar) {
                return;
            }

            btnEliminar.disabled = true;
            btnEliminar.textContent = "Eliminando...";

            mostrarMensaje("Eliminando medicamento...");

            try {

                const respuesta = await fetch(
                    `/api/medicamentos/${medicamentoId}/`,
                    {
                        method: "DELETE",
                        credentials: "same-origin",
                        headers: {
                            "X-CSRFToken": csrfToken,
                            "Accept": "application/json"
                        }
                    }
                );

                if (respuesta.status === 401) {

                    window.location.replace("/?expired=1");
                    return;

                }

                if (respuesta.status === 403) {

                    throw new Error(
                        "Acceso rechazado. Verifica tu sesión y el token CSRF."
                    );

                }

                if (respuesta.status === 404) {

                    throw new Error(
                        "El medicamento ya no existe o fue eliminado anteriormente."
                    );

                }

                if (!respuesta.ok) {

                    throw new Error(
                        `No se pudo eliminar el medicamento. HTTP ${respuesta.status}`
                    );

                }

                mostrarMensaje(
                    "Medicamento eliminado correctamente. Volviendo al inventario..."
                );

                setTimeout(function() {

                    window.location.href = "/medicamentos/";

                }, 1000);

            } catch (error) {

                console.error("Error al eliminar:", error);

                mostrarMensaje(error.message, true);

                btnEliminar.disabled = false;
                btnEliminar.textContent = "Sí, eliminar medicamento";

            }

        });

        cargarMedicamento();

    </script>

</body>
</html>
