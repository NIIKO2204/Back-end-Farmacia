{% extends 'farmaciaapp/base.html' %}

{% block title %}Eliminar Medicamento{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4 mt-4 p-4 text-center">
            <h3 class="fw-bold text-danger mb-3">¿Eliminar Medicamento?</h3>
            <p>¿Estás seguro de que deseas eliminar <strong>{{ medicamento.nombre }}</strong>?</p>
            
            <form method="POST" action="">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger rounded-pill px-4 me-2">Sí, Eliminar</button>
                <a href="{% url 'inicio' %}" class="btn btn-light rounded-pill px-4">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
