{% extends 'farmaciaapp/base.html' %}

{% block title %}Eliminar Medicamento{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4 mt-4 p-5 text-center">
            <!-- Icono de Advertencia -->
            <div class="mb-3 text-danger">
                <i class="bi bi-exclamation-triangle-fill display-4"></i>
            </div>

            <h3 class="fw-bold text-dark mb-2">¿Estás seguro?</h3>
            <p class="text-muted mb-4">
                Vas a eliminar el registro de <strong class="text-dark">{{ medicamento.nombre }}</strong>. Esta acción no se puede deshacer.
            </p>
            
            <form method="POST" action="">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <button type="submit" class="btn btn-danger rounded-pill px-4 fw-semibold shadow-sm">
                        Sí, eliminar
                    </button>
                    <a href="{% url 'inicio' %}" class="btn btn-light rounded-pill px-4 text-secondary border">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
