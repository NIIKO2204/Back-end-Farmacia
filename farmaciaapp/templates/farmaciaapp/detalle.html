<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de medicamento - Farmacia Salud</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #0f172a;
            background: linear-gradient(135deg, #d1fae5, #ecfdf5, #a7f3d0);
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 6%;
            background: #ffffff;
            border-bottom: 3px solid #10b981;
            box-shadow: 0 4px 16px rgba(5, 150, 105, 0.10);
        }

        .cruz {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #10b981, #047857);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        .navbar h2 {
            color: #065f46;
            font-size: 20px;
        }

        .contenedor {
            width: 90%;
            max-width: 700px;
            margin: 45px auto;
        }

        .panel {
            background: #ffffff;
            padding: 35px;
            border: 1px solid #d1fae5;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(5, 150, 105, 0.12);
        }

        h1 {
            color: #065f46;
            margin-bottom: 10px;
        }

        .descripcion-panel {
            color: #475569;
            margin-bottom: 25px;
        }

        .campo {
            margin: 16px 0;
            padding: 16px;
            background: #f0fdf4;
            border-radius: 10px;
            border: 1px solid #d1fae5;
        }

        .etiqueta {
            display: block;
            font-weight: 700;
            color: #065f46;
            margin-bottom: 6px;
        }

        .valor {
            display: block;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }

        .estado {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .disponible {
            color: #065f46;
            background: #d1fae5;
        }

        .no-disponible {
            color: #92400e;
            background: #fef3c7;
        }

        .botones {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px;
        }

        .boton {
            display: inline-block;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .volver {
            background: #d1fae5;
            color: #065f46;
        }

        .volver:hover {
            background: #a7f3d0;
        }

        .editar {
            background: #059669;
            color: #ffffff;
        }

        .editar:hover {
            background: #047857;
        }

        .mensaje {
            padding: 14px;
            margin-top: 20px;
            border-radius: 8px;
            color: #065f46;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
        }

        .mensaje-error {
            color: #991b1b;
            background: #fee2e2;
            border-color: #fecaca;
        }

        @media (max-width: 600px) {
            .contenedor {
                margin: 25px auto;
            }

            .panel {
                padding: 23px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <span class="cruz" aria-hidden="true">+</span>
        <h2>Farmacia Salud</h2>
    </header>

    <main class="contenedor">

        <section class="panel">

            <h1>Ficha del medicamento</h1>

            <p class="descripcion-panel">
                Información detallada del medicamento registrado en el inventario.
            </p>

            <p id="mensaje" class="mensaje">
                Cargando información...
            </p>

            <section id="datosMedicamento" hidden>

                <div class="campo">
                    <span class="etiqueta">ID:</span>
                    <span id="id" class="valor"></span>
                </div>

                <div class="campo">
                    <span class="etiqueta">Medicamento:</span>
                    <span id="nombre" class="valor"></span>
                </div>

                <div class="campo">
                    <span class="etiqueta">Descripción / Presentación:</span>
                    <span id="descripcion" class="valor"></span>
                </div>

                <div class="campo">
                    <span class="etiqueta">Precio:</span>
                    <span id="precio" class="valor"></span>
                </div>

                <div class="campo">
                    <span class="etiqueta">Stock disponible:</span>
                    <span id="stock" class="valor"></span>
                </div>

                <div class="campo">
                    <span class="etiqueta">Disponibilidad:</span>
                    <span id="disponibilidad" class="estado"></span>
                </div>

                <div class="botones">

                    <a href="/medicamentos/" class="boton volver">
                        Volver al inventario
                    </a>

                    <a id="enlaceEditar" class="boton editar">
                        Editar medicamento
                    </a>

                </div>

            </section>

        </section>

    </main>

    <script>

        const partesURL = window.location.pathname
            .split("/")
            .filter(Boolean);

        const medicamentoId = partesURL[partesURL.length - 1];

        const mensaje = document.getElementById("mensaje");
        const datosMedicamento = document.getElementById("datosMedicamento");

        async function cargarDetalle() {

            try {

                const respuesta = await fetch(
                    `/api/medicamentos/${medicamentoId}/`,
                    {
                        method: "GET",
                        credentials: "same-origin",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                if (respuesta.status === 401) {

                    window.location.replace("/?expired=1");
                    return;

                }

                if (respuesta.status === 403) {

                    throw new Error(
                        "Acceso rechazado. Verifica tu sesión."
                    );

                }

                if (respuesta.status === 404) {

                    throw new Error(
                        "El medicamento solicitado no existe."
                    );

                }

                if (!respuesta.ok) {

                    throw new Error(
                        `Error al consultar el medicamento. HTTP ${respuesta.status}`
                    );

                }

                const medicamento = await respuesta.json();

                document.getElementById("id").textContent = medicamento.id;
                document.getElementById("nombre").textContent = medicamento.nombre;
                document.getElementById("descripcion").textContent = medicamento.descripcion;
                document.getElementById("precio").textContent = `$${medicamento.precio}`;
                document.getElementById("stock").textContent = `${medicamento.stock} unidades`;

                const disponibilidad = document.getElementById("disponibilidad");

                if (medicamento.disponible) {

                    disponibilidad.textContent = "Disponible";
                    disponibilidad.className = "estado disponible";

                } else {

                    disponibilidad.textContent = "No disponible";
                    disponibilidad.className = "estado no-disponible";

                }

                document.getElementById("enlaceEditar").href =
                    `/editar/${medicamento.id}/`;

                datosMedicamento.hidden = false;
                mensaje.hidden = true;

            } catch (error) {

                console.error("Error al consultar medicamento:", error);

                mensaje.textContent = error.message;
                mensaje.className = "mensaje mensaje-error";

            }

        }

        cargarDetalle();

    </script>

</body>
</html>
