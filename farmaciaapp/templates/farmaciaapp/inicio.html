{% extends 'farmaciaapp/base.html' %}

{% block title %}Inventario{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h4 fw-bold text-secondary">Inventario de Medicamentos</h2>
    <!-- Este botón conecta con tu crear.html -->
    <a href="#" class="btn btn-success px-4 rounded-pill">Añadir Registro</a>
</div>

<div class="table-responsive">
    <!-- Tabla minimalista: bordes horizontales suaves y texto centrado verticalmente -->
    <table class="table table-hover align-middle">
        <thead class="text-secondary" style="border-bottom: 2px solid #e0e0e0;">
            <tr>
                <th scope="col" class="fw-normal">Nombre</th>
                <th scope="col" class="fw-normal">Laboratorio</th>
                <th scope="col" class="fw-normal">Precio</th>
                <th scope="col" class="fw-normal">Stock</th>
                <th scope="col" class="fw-normal text-end">Acciones</th>
            </tr>
        </thead>
        <tbody class="border-top-0">
            <!-- Aquí irá el ciclo FOR de Django para cargar la base de datos -->
            <!-- Ejemplo de fila estática para ver el diseño: -->
            <tr>
                <td class="fw-semibold">Paracetamol 500mg</td>
                <td class="text-muted">Laboratorio Chile</td>
                <td>$1.500</td>
                <td>
                    <!-- Pequeño badge para el stock -->
                    <span class="badge bg-success bg-opacity-10 text-success px-2 py-1 rounded-pill">150 unid.</span>
                </td>
                <td class="text-end">
                    <!-- Opciones para ver detalle, editar y eliminar -->
                    <a href="#" class="btn btn-sm btn-outline-primary border-0"><i class="bi bi-eye"></i></a>
                    <a href="#" class="btn btn-sm btn-outline-secondary border-0"><i class="bi bi-pencil"></i></a>
                    <a href="#" class="btn btn-sm btn-outline-danger border-0"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            <!-- Fin de ejemplo -->
        </tbody>
    </table>
</div>
{% endblock %}
