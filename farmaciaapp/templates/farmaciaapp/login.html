<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Farmacia Salud</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #0f172a;
            background: linear-gradient(135deg, #d1fae5 0%, #ecfdf5 55%, #a7f3d0 100%);
        }

        .contenedor-login {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background-color: #ffffff;
            border: 1px solid #d1fae5;
            border-radius: 20px;
            box-shadow: 0 16px 38px rgba(5, 150, 105, 0.14);
        }

        .marca-farmacia {
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, #10b981, #047857);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(5, 150, 105, 0.25);
        }

        h1 {
            margin-bottom: 8px;
            color: #065f46;
            font-size: 28px;
            text-align: center;
            letter-spacing: -0.4px;
        }

        .subtitulo {
            margin-bottom: 24px;
            color: #475569;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            margin-top: 8px;
            color: #1e293b;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            font-family: inherit;
            font-size: 15px;
            color: #0f172a;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:hover {
            border-color: #6ee7b7;
        }

        input:focus {
            background-color: #ffffff;
            border-color: #059669;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.16);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #10b981, #047857);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: linear-gradient(135deg, #059669, #065f46);
            box-shadow: 0 8px 18px rgba(5, 150, 105, 0.28);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #mensaje {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        #mensaje:empty {
            display: none;
        }

        #mensaje.exito {
            color: #065f46;
            background-color: #d1fae5;
            border: 1px solid #a7f3d0;
        }

        #mensaje.error {
            color: #991b1b;
            background-color: #fee2e2;
            border: 1px solid #fecaca;
        }

        @media (max-width: 480px) {
            .contenedor-login {
                padding: 30px 22px;
                border-radius: 16px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor-login">

        <div class="marca-farmacia" aria-hidden="true">+</div>

        <h1>Farmacia Salud</h1>

        <p class="subtitulo">
            Ingresa tus credenciales para administrar el catálogo y stock de medicamentos.
        </p>

        <form id="formLogin">

            {% csrf_token %}

            <label for="username">Usuario:</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Ingresa tu usuario"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña:</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="btnIngresar">
                Ingresar al sistema
            </button>

        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>

    </div>

    <script>

        const formulario = document.getElementById('formLogin');
        const mensaje = document.getElementById('mensaje');
        const boton = document.getElementById('btnIngresar');

        const csrfToken = document.querySelector(
            '[name=csrfmiddlewaretoken]'
        ).value;

        formulario.addEventListener('submit', async function(event) {

            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            mensaje.textContent = '';
            mensaje.className = '';

            boton.disabled = true;
            boton.textContent = 'Validando...';

            try {

                const respuesta = await fetch('/web/login/', {

                    method: 'POST',

                    credentials: 'same-origin',

                    headers: {

                        'Content-Type': 'application/json',

                        'X-CSRFToken': csrfToken

                    },

                    body: JSON.stringify({

                        username: username,

                        password: password

                    })

                });

                const datos = await respuesta.json();

                if (respuesta.ok) {

                    mensaje.textContent = 'Inicio de sesión correcto';
                    mensaje.className = 'exito';

                    window.location.href = '/medicamentos/';

                } else {

                    mensaje.textContent =
                        datos.error || 'Error al iniciar sesión';
                    mensaje.className = 'error';

                }

            } catch (error) {

                mensaje.textContent =
                    'No se pudo conectar con el servidor. Intenta nuevamente.';
                mensaje.className = 'error';

            } finally {

                boton.disabled = false;
                boton.textContent = 'Ingresar al sistema';

            }

        });

    </script>

</body>

</html>
