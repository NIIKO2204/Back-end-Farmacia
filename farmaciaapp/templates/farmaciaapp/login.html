<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Farmacia Vital</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="container px-3">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="login-card p-4 p-md-5 mx-auto">
                    <!-- Encabezado -->
                    <div class="text-center mb-4">
                        <div class="text-success mb-2">
                            <i class="bi bi-capsule display-5"></i>
                        </div>
                        <h2 class="h4 fw-bold text-dark">Farmacia Vital</h2>
                        <p class="text-muted small">Ingresa tus credenciales para acceder</p>
                    </div>

                    <!-- Mensaje de Error (si existe) -->
                    {% if error %}
                        <div class="alert alert-danger py-2 small text-center mb-3 rounded-pill" role="alert">
                            <i class="bi bi-exclamation-circle me-1"></i> {{ error }}
                        </div>
                    {% endif %}

                    <!-- Formulario de Login -->
                    <form method="POST" action="{% url 'login_pagina' %}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Tu usuario" maxlength="150" required autofocus>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-secondary">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success rounded-pill py-2 fw-bold text-white shadow-sm">
                                Iniciar Sesión
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
