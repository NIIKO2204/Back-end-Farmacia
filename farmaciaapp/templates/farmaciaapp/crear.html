<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar medicamento - Farmacia Salud</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #0f172a;
            background: linear-gradient(135deg, #d1fae5, #ecfdf5, #a7f3d0);
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 6%;
            background: #ffffff;
            border-bottom: 3px solid #10b981;
            box-shadow: 0 4px 16px rgba(5, 150, 105, 0.10);
        }

        .cruz {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #10b981, #047857);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        .navbar h2 {
            color: #065f46;
            font-size: 20px;
        }

        .contenedor {
            width: 90%;
            max-width: 650px;
            margin: 45px auto;
        }

        .panel {
            background: #ffffff;
            padding: 35px;
            border: 1px solid #d1fae5;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(5, 150, 105, 0.12);
        }

        h1 {
            color: #065f46;
            margin-bottom: 10px;
        }

        .descripcion {
            color: #475569;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1e293b;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f0fdf4;
            font-family: inherit;
            font-size: 15px;
            color: #0f172a;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: 3px solid rgba(16, 185, 129, 0.18);
            border-color: #059669;
            background: #ffffff;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox input {
            width: 17px;
            height: 17px;
            accent-color: #059669;
        }

        .checkbox label {
            margin: 0;
        }

        .botones {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button,
        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .btn-guardar {
            color: #ffffff;
            background: #059669;
        }

        .btn-guardar:hover {
            background: #047857;
        }

        .btn-volver {
            color: #065f46;
            background: #d1fae5;
        }

        .btn-volver:hover {
            background: #a7f3d0;
        }

        .mensaje {
            display: none;
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .mensaje-error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
        }

        .mensaje-exito {
            display: block;
            color: #065f46;
            background: #d1fae5;
        }

        @media (max-width: 600px) {
            .contenedor {
                margin: 25px auto;
            }

            .panel {
                padding: 23px;
            }
        }
    </style>
</head>

<body>

    {% csrf_token %}

    <header class="navbar">
        <span class="cruz" aria-hidden="true">+</span>
        <h2>Farmacia Salud</h2>
    </header>

    <main class="contenedor">

        <section class="panel">

            <h1>Registrar medicamento</h1>

            <p class="descripcion">
                Completa los campos para agregar un nuevo medicamento al inventario de la farmacia.
            </p>

            <form id="formMedicamento">

                <div class="campo">

                    <label for="nombre">Nombre del medicamento:</label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        maxlength="100"
                        required
                        placeholder="Ej: Paracetamol 500mg"
                    >

                </div>

                <div class="campo">

                    <label for="descripcion">Descripción / Presentación:</label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        required
                        placeholder="Ej: Comprimidos recubiertos, caja de 20 unidades..."
                    ></textarea>

                </div>

                <div class="campo">

                    <label for="precio">Precio ($):</label>

                    <input
                        type="number"
                        id="precio"
                        name="precio"
                        step="0.01"
                        min="0"
                        required
                        placeholder="Ej: 2500.00"
                    >

                </div>

                <div class="campo">

                    <label for="stock">Stock en bodega (unidades):</label>

                    <input
                        type="number"
                        id="stock"
                        name="stock"
                        min="0"
                        step="1"
                        required
                        placeholder="Ej: 30"
                    >

                </div>

                <div class="campo checkbox">

                    <input
                        type="checkbox"
                        id="disponible"
                        name="disponible"
                        checked
                    >

                    <label for="disponible">
                        Disponible para dispensación
                    </label>

                </div>

                <div class="botones">

                    <button
                        type="submit"
                        class="btn-guardar"
                        id="btnGuardar"
                    >
                        Guardar medicamento
                    </button>

                    <a href="/medicamentos/" class="btn btn-volver">
                        Volver al inventario
                    </a>

                </div>

            </form>

            <div id="mensaje" class="mensaje" role="alert"></div>

        </section>

    </main>

    <script>

        const formulario = document.getElementById("formMedicamento");
        const mensaje = document.getElementById("mensaje");
        const botonGuardar = document.getElementById("btnGuardar");

        const csrfToken = document.querySelector(
            "[name=csrfmiddlewaretoken]"
        ).value;

        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const descripcion = document.getElementById("descripcion").value.trim();
            const precioValor = document.getElementById("precio").value;
            const stockValor = document.getElementById("stock").value;
            const disponible = document.getElementById("disponible").checked;

            const precio = Number(precioValor);
            const stock = Number(stockValor);

            if (
                !nombre ||
                !descripcion ||
                precioValor === "" ||
                stockValor === "" ||
                Number.isNaN(precio) ||
                Number.isNaN(stock) ||
                precio < 0 ||
                stock < 0
            ) {

                mostrarMensaje(
                    "Debes ingresar nombre, descripción, precio y stock válidos.",
                    "error"
                );

                return;
            }

            const medicamento = {
                nombre: nombre,
                descripcion: descripcion,
                precio: precio,
                stock: Math.trunc(stock),
                disponible: disponible
            };

            botonGuardar.disabled = true;
            botonGuardar.textContent = "Guardando...";

            try {

                const respuesta = await fetch("/api/medicamentos/", {

                    method: "POST",

                    credentials: "same-origin",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                        "X-CSRFToken": csrfToken
                    },

                    body: JSON.stringify(medicamento)

                });

                if (respuesta.status === 401) {

                    window.location.replace("/?expired=1");
                    return;

                }

                const datos = await respuesta.json();

                if (respuesta.ok) {

                    mostrarMensaje(
                        "Medicamento registrado correctamente. Volviendo al inventario...",
                        "exito"
                    );

                    formulario.reset();

                    setTimeout(function() {

                        window.location.href = "/medicamentos/";

                    }, 1200);

                } else if (respuesta.status === 403) {

                    mostrarMensaje(
                        "Acceso rechazado. Comprueba tu sesión y el token CSRF.",
                        "error"
                    );

                } else {

                    mostrarMensaje(
                        datos.error || "No se pudo registrar el medicamento.",
                        "error"
                    );

                }

            } catch (error) {

                console.error("Error al crear medicamento:", error);

                mostrarMensaje(
                    "Error de conexión con el servidor.",
                    "error"
                );

            } finally {

                botonGuardar.disabled = false;
                botonGuardar.textContent = "Guardar medicamento";

            }

        });

        function mostrarMensaje(texto, tipo) {

            mensaje.textContent = texto;

            mensaje.className = tipo === "exito"
                ? "mensaje mensaje-exito"
                : "mensaje mensaje-error";

        }

    </script>

</body>
</html>
