<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia - {% block title %}Inicio{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos minimalistas (opcional) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa; /* Gris súper claro y limpio */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            border-bottom: 1px solid #eaeaea;
        }
        .content-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid #f0f0f0;
        }
    </style>
</head>
<body>

    <!-- Navegación Funcional y Limpia -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-5">
        <div class="container">
            <!-- Icono y título sutil -->
            <a class="navbar-brand fw-bold text-success" href="#">
                <i class="bi bi-capsule"></i> Farmacia Vital
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Inventario</a>
                    </li>
                    <li class="nav-item">
                        <!-- Botón sutil para crear -->
                        <a class="nav-link btn btn-outline-success border-0 px-3 ms-2" href="#">+ Nuevo Medicamento</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <main class="container">
        <div class="content-card shadow-sm">
            {% block content %}
            <!-- El contenido de tus otras vistas irá aquí -->
            {% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
