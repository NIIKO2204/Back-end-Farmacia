<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia Vital - {% block title %}Sistema{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --pharma-green: #0d9488;
            --pharma-dark: #0f766e;
            --pharma-light: #ccfbf1;
        }
        body {
            background-color: #f0fdf4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-pharma {
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
        }
        .content-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(13, 148, 136, 0.05);
        }
        .btn-pharma {
            background-color: var(--pharma-green);
            color: white;
            border: none;
        }
        .btn-pharma:hover {
            background-color: var(--pharma-dark);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navegación Temática -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pharma shadow-sm mb-4 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="{% url 'inicio' %}">
                <span class="bg-white text-teal rounded-circle d-inline-flex p-2 shadow-sm" style="color: #0d9488;">
                    <i class="bi bi-plus-lg fs-5"></i>
                </span>
                <span>Farmacia <span class="fw-light">Vital</span></span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="{% url 'inicio' %}">
                            <i class="bi bi-capsule me-1"></i> Inventario Médicos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-light rounded-pill px-3 fw-bold text-success" style="color: #0d9488 !important;" href="{% url 'crear_medicamento' %}">
                            <i class="bi bi-journal-plus me-1"></i> Ingresar Producto
                        </a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-outline-light btn-sm rounded-pill px-3 opacity-75" href="{% url 'login_pagina' %}">
                            <i class="bi bi-box-arrow-right me-1"></i> Salir
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <main class="container mb-5">
        <div class="content-card">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
