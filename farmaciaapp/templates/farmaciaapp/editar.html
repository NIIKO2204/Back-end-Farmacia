{% extends 'farmaciaapp/base.html' %}

{% block title %}Editar Medicamento{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4 mt-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 class="h4 fw-bold text-success">Editar Medicamento</h2>
                </div>

                <form method="POST" action="">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre</label>
                        <input type="text" name="nombre" value="{{ medicamento.nombre }}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3">{{ medicamento.descripcion }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Precio ($)</label>
                        <input type="number" name="precio" value="{{ medicamento.precio }}" class="form-control" min="0" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Stock</label>
                        <input type="number" name="stock" value="{{ medicamento.stock }}" class="form-control" min="0" required>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" name="requiere_receta" id="requiere_receta" class="form-check-input" {% if medicamento.requiere_receta %}checked{% endif %}>
                        <label class="form-check-label fw-semibold" for="requiere_receta">
                            Requiere receta médica
                        </label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success rounded-pill py-2 fw-bold">
                            Actualizar Medicamento
                        </button>
                        <a href="{% url 'inicio' %}" class="btn btn-light rounded-pill py-2 text-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
