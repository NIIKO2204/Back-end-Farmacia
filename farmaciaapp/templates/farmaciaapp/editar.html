<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar medicamento - Farmacia Salud</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #0f172a;
            background: linear-gradient(135deg, #d1fae5, #ecfdf5, #a7f3d0);
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 6%;
            background: #ffffff;
            border-bottom: 3px solid #10b981;
            box-shadow: 0 4px 16px rgba(5, 150, 105, 0.10);
        }

        .cruz {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #10b981, #047857);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        .navbar h2 {
            color: #065f46;
            font-size: 20px;
        }

        .contenedor {
            width: 90%;
            max-width: 700px;
            margin: 45px auto;
        }

        .panel {
            background: #ffffff;
            padding: 35px;
            border: 1px solid #d1fae5;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(5, 150, 105, 0.12);
        }

        h1 {
            color: #065f46;
            margin-bottom: 10px;
        }

        .descripcion-panel {
            color: #475569;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1e293b;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f0fdf4;
            font-family: inherit;
            font-size: 15px;
            color: #0f172a;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: 3px solid rgba(16, 185, 129, 0.18);
            border-color: #059669;
            background: #ffffff;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox input {
            width: 17px;
            height: 17px;
            accent-color: #059669;
        }

        .checkbox label {
            margin: 0;
        }

        .botones {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button,
        .boton {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .guardar {
            color: #ffffff;
            background: #059669;
        }

        .guardar:hover {
            background: #047857;
        }

        .volver {
            color: #065f46;
            background: #d1fae5;
        }

        .volver:hover {
            background: #a7f3d0;
        }

        .mensaje {
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            color: #065f46;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            line-height: 1.5;
        }

        .mensaje-error {
            color: #991b1b;
            background: #fee2e2;
            border-color: #fecaca;
        }

        .mensaje-exito {
            color: #065f46;
            background: #d1fae5;
            border-color: #a7f3d0;
        }

        @media (max-width: 600px) {
            .contenedor {
                margin: 25px auto;
            }

            .panel {
                padding: 23px;
            }
        }
    </style>
</head>

<body>

    {% csrf_token %}

    <header class="navbar">
        <span class="cruz" aria-hidden="true">+</span>
        <h2>Farmacia Salud</h2>
    </header>

    <main class="contenedor">

        <section class="panel">

            <h1>Editar medicamento</h1>

            <p class="descripcion-panel">
                Actualiza los datos, precio, stock o disponibilidad del medicamento.
            </p>

            <p id="mensaje" class="mensaje">
                Cargando información del medicamento...
            </p>

            <form id="formEditar" hidden>

                <div class="campo">

                    <label for="nombre">Nombre del medicamento:</label>

                    <input
                        type="text"
                        id="nombre"
                        required
                        maxlength="100"
                        placeholder="Ingresa el nombre"
                    >

                </div>

                <div class="campo">

                    <label for="descripcion">Descripción / Presentación:</label>

                    <textarea
                        id="descripcion"
                        required
                        placeholder="Describe el medicamento"
                    ></textarea>

                </div>

                <div class="campo">

                    <label for="precio">Precio ($):</label>

                    <input
                        type="number"
                        id="precio"
                        step="0.01"
                        min="0"
                        required
                        placeholder="Ej: 2500.00"
                    >

                </div>

                <div class="campo">

                    <label for="stock">Stock en bodega (unidades):</label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        step="1"
                        required
                        placeholder="Ej: 20"
                    >

                </div>

                <div class="campo checkbox">

                    <input
                        type="checkbox"
                        id="disponible"
                    >

                    <label for="disponible">
                        Disponible para dispensación
                    </label>

                </div>

                <div class="botones">

                    <button
                        type="submit"
                        class="guardar"
                        id="btnGuardar"
                    >
                        Guardar cambios
                    </button>

                    <a href="/medicamentos/" class="boton volver">
                        Volver al inventario
                    </a>

                </div>

            </form>

        </section>

    </main>

    <script>

        const partesURL = window.location.pathname
            .split("/")
            .filter(Boolean);

        const medicamentoId = partesURL[partesURL.length - 1];

        const formulario = document.getElementById("formEditar");

        const campoNombre = document.getElementById("nombre");
        const campoDescripcion = document.getElementById("descripcion");
        const campoPrecio = document.getElementById("precio");
        const campoStock = document.getElementById("stock");
        const campoDisponible = document.getElementById("disponible");

        const mensaje = document.getElementById("mensaje");
        const botonGuardar = document.getElementById("btnGuardar");

        const csrfToken = document.querySelector(
            "[name=csrfmiddlewaretoken]"
        ).value;

        function mostrarMensaje(texto, tipo) {

            mensaje.textContent = texto;

            mensaje.className = tipo === "error"
                ? "mensaje mensaje-error"
                : tipo === "exito"
                    ? "mensaje mensaje-exito"
                    : "mensaje";

        }

        async function cargarMedicamento() {

            try {

                const respuesta = await fetch(
                    `/api/medicamentos/${medicamentoId}/`,
                    {
                        method: "GET",
                        credentials: "same-origin",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                if (respuesta.status === 401) {

                    window.location.replace("/?expired=1");
                    return;

                }

                if (respuesta.status === 403) {

                    throw new Error(
                        "Acceso rechazado. Verifica tu sesión."
                    );

                }

                if (respuesta.status === 404) {

                    throw new Error(
                        "El medicamento solicitado no existe."
                    );

                }

                if (!respuesta.ok) {

                    throw new Error(
                        `No se pudo cargar el medicamento. HTTP ${respuesta.status}`
                    );

                }

                const medicamento = await respuesta.json();

                campoNombre.value = medicamento.nombre;
                campoDescripcion.value = medicamento.descripcion;
                campoPrecio.value = medicamento.precio;
                campoStock.value = medicamento.stock;
                campoDisponible.checked = medicamento.disponible;

                formulario.hidden = false;

                mostrarMensaje(
                    `Editando medicamento #${medicamento.id}`,
                    "normal"
                );

            } catch (error) {

                console.error("Error al cargar medicamento:", error);

                mostrarMensaje(error.message, "error");

            }

        }

        formulario.addEventListener("submit", async function(evento) {

            evento.preventDefault();

            const precio = Number(campoPrecio.value);
            const stock = Number(campoStock.value);

            const datos = {

                nombre: campoNombre.value.trim(),
                descripcion: campoDescripcion.value.trim(),
                precio: precio,
                stock: Math.trunc(stock),
                disponible: campoDisponible.checked

            };

            if (
                !datos.nombre ||
                !datos.descripcion ||
                campoPrecio.value === "" ||
                campoStock.value === "" ||
                Number.isNaN(precio) ||
                Number.isNaN(stock) ||
                precio < 0 ||
                stock < 0
            ) {

                mostrarMensaje(
                    "Debes ingresar nombre, descripción, precio y stock válidos.",
                    "error"
                );

                return;

            }

            botonGuardar.disabled = true;
            botonGuardar.textContent = "Guardando cambios...";

            mostrarMensaje("Actualizando medicamento...", "normal");

            try {

                const respuesta = await fetch(
                    `/api/medicamentos/${medicamentoId}/`,
                    {
                        method: "PUT",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json",
                            "X-CSRFToken": csrfToken
                        },
                        body: JSON.stringify(datos)
                    }
                );

                if (respuesta.status === 401) {

                    window.location.replace("/?expired=1");
                    return;

                }

                if (respuesta.status === 403) {

                    throw new Error(
                        "Acceso rechazado. Verifica tu sesión y el token CSRF."
                    );

                }

                const resultado = await respuesta.json();

                if (!respuesta.ok) {

                    throw new Error(
                        resultado.error ||
                        resultado.mensaje ||
                        `Error HTTP ${respuesta.status}`
                    );

                }

                mostrarMensaje(
                    "Medicamento actualizado correctamente.",
                    "exito"
                );

                setTimeout(function() {

                    window.location.href = "/medicamentos/";

                }, 1200);

            } catch (error) {

                console.error("Error al actualizar:", error);

                mostrarMensaje(error.message, "error");

                botonGuardar.disabled = false;
                botonGuardar.textContent = "Guardar cambios";

            }

        });

        cargarMedicamento();

    </script>

</body>
</html>
