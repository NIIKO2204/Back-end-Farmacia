<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tareas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .contenedor {
            width: 80%;
            margin: 40px auto;
        }
        h1 {
            text-align: center;
        }
        .acciones {
            text-align: center;
            margin-bottom: 30px;
        }
        .boton {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .boton:hover {
            background-color: #555;
        }
        .tarea {
            background-color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.05);
            word-break: break-word;
            overflow-wrap: break-word;
        }
        .tarea h2 {
            margin-top: 0;
            word-break: break-word;
        }
        .botones {
            margin-top: 15px;
        }
        .botones a {
            margin-right: 10px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        .botones a:hover {
            text-decoration: underline;
        }
        #mensaje {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }
        /* Apartado visual para lista vacía */
        .lista-vacia {
            background-color: #fff;
            border: 2px dashed #ccc;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            color: #777;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>📝 Listado de Tareas</h1>

    <div class="acciones">
        <a href="{% url 'crear_tarea' %}" class="boton">
            ➕ Agregar al inventario
        </a>
    </div>

    <p id="mensaje" role="status" aria-live="polite">
        Cargando elementos...
    </p>

    <div id="lista-tareas"></div>

</div>

<script>
    const listaTareas = document.getElementById('lista-tareas');
    const mensaje = document.getElementById('mensaje');

    async function cargarTareas() {
        const token = sessionStorage.getItem('token');

        if (!token) {
            mensaje.textContent = 'Debes iniciar sesión para ver tus registros.';
            setTimeout(() => {
                window.location.href = '/';
            }, 1500);
            return;
        }

        try {
            const respuesta = await fetch('/api/tareas/', {
                method: 'GET',
                headers: {
                    'Authorization': `Token ${token}`
                }
            });

            if (respuesta.status === 401 || respuesta.status === 403) {
                sessionStorage.removeItem('token');
                window.location.href = '/';
                return;
            }

            if (!respuesta.ok) {
                mensaje.textContent = 'Error al consultar los registros del servidor.';
                return;
            }

            const tareas = await respuesta.json();
            listaTareas.replaceChildren();

            // Si la lista está vacía, mostramos el apartado visual correspondiente
            if (tareas.length === 0) {
                mensaje.textContent = '';
                
                const apartadoVacio = document.createElement('div');
                apartadoVacio.className = 'lista-vacia';
                apartadoVacio.innerHTML = `
                    <p style="font-size: 24px; margin: 0 0 10px 0;">📦</p>
                    <strong>La lista está vacía</strong>
                    <p style="margin: 5px 0 0 0; color: #999;">No hay elementos registrados en este momento.</p>
                `;
                listaTareas.appendChild(apartadoVacio);
                return;
            }

            mensaje.textContent = '';

            tareas.forEach(tarea => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarea';

                const titulo = document.createElement('h2');
                titulo.textContent = tarea.titulo;

                const descripcion = document.createElement('p');
                descripcion.textContent = tarea.descripcion;

                const estado = document.createElement('p');
                const etiqueta = document.createElement('strong');

                etiqueta.textContent = 'Estado: ';
                estado.appendChild(etiqueta);
                estado.append(
                    tarea.completada
                        ? 'Completada ✅'
                        : 'Pendiente ⏳'
                );

                const botones = document.createElement('div');
                botones.className = 'botones';

                const enlaceDetalle = document.createElement('a');
                enlaceDetalle.href = `/detalle/${tarea.id}/`;
                enlaceDetalle.textContent = '👁️ Ver';

                const enlaceEditar = document.createElement('a');
                enlaceEditar.href = `/editar/${tarea.id}/`;
                enlaceEditar.textContent = '✏️ Editar';

                const enlaceEliminar = document.createElement('a');
                enlaceEliminar.href = `/eliminar/${tarea.id}/`;
                enlaceEliminar.textContent = '🗑️ Eliminar';

                botones.append(
                    enlaceDetalle,
                    enlaceEditar,
                    enlaceEliminar
                );

                tarjeta.append(
                    titulo,
                    descripcion,
                    estado,
                    botones
                );

                listaTareas.appendChild(tarjeta);
            });

        } catch (error) {
            mensaje.textContent = 'No se pudo conectar con el servidor.';
            console.error('Error al cargar elementos:', error);
        }
    }

    cargarTareas();
</script>

</body>
</html>
